<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Payment | Rosa Waves</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", sans-serif;
    }

    .payment-card {
      max-width: 480px;
      width: 100%;
      border-radius: 15px;
      overflow: hidden;
      animation: fadeIn 0.8s ease-in-out;
    }

    .payment-header {
      background: #198754;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .amount-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      margin: 20px 0;
    }

    .amount-box h2 {
      margin: 0;
      color: #198754;
      font-weight: 700;
    }

    .pay-btn {
      font-size: 18px;
      padding: 12px;
      border-radius: 30px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .pay-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(25, 135, 84, 0.4);
    }

    .secure-text {
      font-size: 13px;
      color: #6c757d;
      margin-top: 12px;
      text-align: center;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="card payment-card shadow-lg">
    <div class="payment-header">
      <h4 class="mb-0">
        <i class="bi bi-shield-lock-fill"></i>
        Confirm Your Payment
      </h4>
    </div>

    <div class="card-body p-4">

      <!-- Booking Details -->
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex justify-content-between">
          <strong>Name</strong>
          <span>{{ booking.full_name }}</span>
        </li>

        <li class="list-group-item d-flex justify-content-between">
          <strong>Bike</strong>
          <span>{{ booking.bike_model }}</span>
        </li>

        <li class="list-group-item d-flex justify-content-between">
          <strong>Rental Days</strong>
          <span>{{ booking.rental_days }}</span>
        </li>
      </ul>

      <!-- Amount -->
      <div class="amount-box">
        <p class="mb-1 text-muted">Total Payable</p>
        <h2>₹ {{ booking.total_bill_amount }}</h2>
      </div>

      <!-- Pay Button -->
      <button id="payBtn" class="btn btn-success w-100 pay-btn">
        <i class="bi bi-credit-card-2-front"></i>
        Pay Now
      </button>

      <div class="secure-text">
        🔒 100% Secure payment via Razorpay
      </div>

    </div>
  </div>

  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    document.getElementById("payBtn").onclick = function () {

      const options = {
        key: "{{ razorpay_key }}",
        amount: {{ booking.total_bill_amount }} * 100,
        currency: "INR",
        name: "Rosa Waves Bike Rental",
        description: "Bike Rental Payment",
        order_id: "{{ order_id }}",

        handler: function (response) {
          window.location.href =
            "{% url 'payment_success' booking.id %}" +
            "?pid=" + response.razorpay_payment_id;
        },

        theme: {
          color: "#198754"
        }
      };

      new Razorpay(options).open();
    };
  </script>

</body>
</html>
