{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Successful | Rosa Waves</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .confirmation-card {
            max-width: 520px;
            margin: 90px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
            text-align: center;
        }

        .success-icon {
            font-size: 60px;
            color: #198754;
            margin-bottom: 15px;
        }

        .booking-id {
            background: #f1f3f5;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            margin: 15px 0;
        }
    </style>
</head>

<body>

<div class="confirmation-card">

    <!-- Success Icon -->
    <div class="success-icon">✅</div>

    <h3 class="mb-3 text-success">Booking Successful</h3>

    <p class="text-muted mb-3">
        Thank you for choosing <strong>Rosa Waves Bike Rental</strong>.<br>
        Your payment was completed successfully.
    </p>

    <!-- Booking ID -->
    <div class="booking-id">
        Booking ID: <span class="text-success">#{{ booking.id }}</span>
    </div>

    <!-- Invoice Download -->
    <a href="{% url 'download_invoice' booking.id %}"
       class="btn btn-primary w-100 mb-2">
        📄 Download Invoice
    </a>

    <!-- Call Button -->
    <a href="tel:+919207535648" class="btn btn-success w-100 mb-2">
        📞 Call Us
    </a>

    <!-- Booking Status -->
    <a href="{% url 'booking_status' %}" class="btn btn-outline-secondary w-100">
        View Booking Status
    </a>

</div>

</body>
</html>
